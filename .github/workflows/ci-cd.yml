name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # login a Azure por OIDC (sin guardar contraseñas del service principal)
  contents: read

env:
  DOTNET_NOLOGO: true
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-dentalcare' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'brazilsouth' }}

jobs:
  build-test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Tests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Publish
        run: dotnet publish src/DentalCare.Web/DentalCare.Web.csproj --configuration Release --no-build --output ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish

  deploy:
    name: Deploy a Azure
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.infra.outputs.webAppUrl }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - name: Login en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resource group
        run: az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

      - name: Infraestructura (Bicep)
        id: infra
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              mysqlAdminPassword="$MYSQL_ADMIN_PASSWORD" \
              jwtKey="$JWT_KEY" \
              seedOdontologoPassword="$SEED_PASSWORD" \
            --query properties.outputs --output json)
          echo "webAppName=$(echo "$outputs" | jq -r .webAppName.value)" >> "$GITHUB_OUTPUT"
          echo "webAppUrl=$(echo "$outputs" | jq -r .webAppUrl.value)" >> "$GITHUB_OUTPUT"
        env:
          MYSQL_ADMIN_PASSWORD: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_ODONTOLOGO_PASSWORD }}

      - name: Deploy de la API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.webAppName }}
          package: ./publish

      - name: Smoke test
        run: |
          url="${{ steps.infra.outputs.webAppUrl }}/health"
          for i in $(seq 1 30); do
            if curl -fsS "$url"; then echo; echo "API OK en $url"; exit 0; fi
            echo "Esperando a que la API responda ($i/30)..."; sleep 10
          done
          echo "La API no respondió en $url"; exit 1
