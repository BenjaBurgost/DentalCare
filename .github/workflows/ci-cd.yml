name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  # CI: compila y corre los tests en cada push y pull request a main.
  build-test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # fija .NET 8 (global.json)

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Tests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Publish
        run: dotnet publish src/DentalCare.Web/DentalCare.Web.csproj --configuration Release --no-build --output ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish

  # Despliegue a Azure: NO es automático. Se ejecuta a mano con "Run workflow" (workflow_dispatch),
  # porque todavía no tenemos cuenta de Azure. Aplica las migraciones y publica la API.
  deploy:
    name: Deploy a Azure (manual)
    needs: build-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.11

      # Aplica las migraciones pendientes a la base de Azure.
      # La cadena llega por la variable ConnectionStrings__DefaultConnection, que es la que lee
      # DentalCareDbContextFactory (en nuestro caso --connection no aplica por usar una design-time factory).
      - name: Aplicar migraciones (EF Core)
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --project src/DentalCare.Infrastructure \
            --startup-project src/DentalCare.Web

      # Publica el artifact en el App Service usando el publish profile (sin guardar credenciales de Azure).
      - name: Deploy de la API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'dentalcare-api' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
